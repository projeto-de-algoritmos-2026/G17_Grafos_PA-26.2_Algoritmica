<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijkstra</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Dijkstra</h1>
    <h2>Encontre a rota com o <b>menor custo</b> saindo de <b>S</b> até <b>T</b>.</h2>
    <h3>Clique nos nós na ordem do seu caminho (comece clicando em S):</h3>
    
    <div class="container-grafos">
        <div class="caixa-grafo">
            <h3>Sua Resposta</h3>
            <div id="cy"></div>
        </div>
        <div class="caixa-grafo" id="caixa-gabarito" style="display: none;">
            <h3>Dijkstra</h3>
            <div id="cy-gabarito"></div>
        </div>
    </div>

    <div class="painel">
        <p>Seu caminho atual:<span id="caminho-texto">Nenhum nó selecionado</span></p>
        <button id="btn-limpar" class="limpar" onclick="limparSelecao()">Limpar Caminho</button>
        <button id="btn-reiniciar" class="resetar" onclick="resetarJogo()" style="display: none; background-color: #17a2b8">Reiniciar Rodada</button>
        <button id="btn-enviar" onclick="enviarPalpite()">Enviar Resposta</button>
        <h2 id="resultado"></h2>
    </div>
    
    <script src="\backend\script.js"></script>
</body>
</html>
