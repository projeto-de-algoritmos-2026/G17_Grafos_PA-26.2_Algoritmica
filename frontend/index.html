<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritmica</title>
    <!-- coloquei script dentro do html por ser curto -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-menu">

    <div class="menu-card">
        <h1>Algoritmica</h1>
        <p>Um ambiente para testar sua capacidade de analisar rotas e conexões. Este é um jogo simples para ver quão bom você é em Grafos.</p>
        <p>Mostraremos um mapa, e você tentará encontrar a solução ótima.</p>

        <div class="subtitle">Vamos começar.</div>

        <div class="controles">
            <div class="toggle-wrapper">
                <label class="switch">
                    <input type="checkbox" id="toggle-dificuldade" onchange="atualizarTexto()">
                    <span class="slider"></span>
                </label>
                <span class="dificuldade-texto" id="texto-dificuldade">Fácil</span>
            </div>

            <button class="btn-jogar" onclick="sortearEIniciar()">➔</button>
        </div>
    </div>

    <!-- logica do inicio do site menu -->
    <script>
        function atualizarTexto() {
            const toggle = document.getElementById('toggle-dificuldade');
            const texto = document.getElementById('texto-dificuldade');
            texto.innerText = toggle.checked ? 'Difícil' : 'Fácil';
        }

        function sortearEIniciar() {
            const isDificil = document.getElementById('toggle-dificuldade').checked;
            const dificuldade = isDificil ? 'dificil' : 'facil';
            
            const jogos = ['dijkstra', 'kruskal'];
            
            const indiceSorteado = Math.floor(Math.random() * jogos.length);
            let jogoEscolhido = jogos[indiceSorteado];

            //qnd terminar kruskal apaga essa linha
            jogoEscolhido = 'dijkstra'; 

            window.location.href = jogoEscolhido + '.html?dificuldade=' + dificuldade;
        }
    </script>
</body>
</html>
